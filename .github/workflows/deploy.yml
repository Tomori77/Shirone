# 跨仓自动构建：内容仓 push -> repository_dispatch -> 本仓构建并部署到 Cloudflare Pages。
# 触发方式：repository_dispatch(content-updated) / push main / 手动 / 每日兜底。
# 必需 Secrets（本仓 Settings > Secrets and variables > Actions）：
#   - CONTENT_REPO_TOKEN     读取私有内容仓（fine-grained PAT，Contents: Read）
#   - CLOUDFLARE_API_TOKEN   Cloudflare API 令牌（账户级，权限：Cloudflare Pages: Edit）
#   - CLOUDFLARE_ACCOUNT_ID   Cloudflare Account ID
name: Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "rules/**"
      - "README*.md"
      - "*.md"
  repository_dispatch:
    types: [content-updated]
  workflow_dispatch:
    inputs:
      content_ref:
        description: "内容仓 ref 或 commit SHA（留空使用 main）"
        required: false
        default: ""
  schedule:
    - cron: "17 4 * * *"

concurrency:
  group: deploy
  cancel-in-progress: true

permissions:
  contents: read

env:
  CONTENT_REPOSITORY: Tomori77/Shirone-Content
  CONTENT_WORKING_COPY: .content-src
  CLOUDFLARE_PROJECT: tomori-blog

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: true
      # 让 content:sync 走「本地目录」模式（内容由下面的 checkout 取得）。
      CONTENT_DIR: .content-src
      # if 条件不能引用 secrets，故在此算出「是否存在 CF 令牌」标记。
      HAS_CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}

    steps:
      - name: Resolve content ref
        id: target
        env:
          PAYLOAD_SHA: ${{ github.event.client_payload.sha }}
          INPUT_REF: ${{ github.event.inputs.content_ref }}
        run: |
          set -euo pipefail
          ref="${PAYLOAD_SHA:-}"
          [ -n "$ref" ] || ref="${INPUT_REF:-}"
          [ -n "$ref" ] || ref="main"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Checkout theme
        uses: actions/checkout@v4

      - name: Checkout content
        uses: actions/checkout@v4
        with:
          repository: ${{ env.CONTENT_REPOSITORY }}
          ref: ${{ steps.target.outputs.ref }}
          path: ${{ env.CONTENT_WORKING_COPY }}
          token: ${{ secrets.CONTENT_REPO_TOKEN }}
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.28.2
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Materialize content and config
        run: pnpm content:sync

      - name: Build site
        run: pnpm build

      - name: Deploy to Cloudflare Pages
        # 未配置 CLOUDFLARE_API_TOKEN 时跳过部署（构建仍会执行），配置后自动生效。
        if: ${{ env.HAS_CLOUDFLARE_TOKEN == 'true' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4 pages deploy dist \
            --project-name="${{ env.CLOUDFLARE_PROJECT }}" \
            --branch=main \
            --commit-dirty=true
